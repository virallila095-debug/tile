<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiles Accounts</title><meta name="theme-color" content="#1f4e5f"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f1ee;--card:#fff;--ink:#23211f;--mute:#76716a;--line:#ddd8d0;--pri:#1f4e5f;--g:#cfeccf;--gt:#14551c;--r:#f6cccc;--rt:#8a1c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--card:#262421;--ink:#f1eee9;--mute:#a29d94;--line:#3d3a35;--pri:#5fa6bd;--g:#1f4a25;--gt:#b8ecbd;--r:#552121;--rt:#f5bcbc}}
:root[data-theme="dark"]{--bg:#1a1917;--card:#262421;--ink:#f1eee9;--mute:#a29d94;--line:#3d3a35;--pri:#5fa6bd;--g:#1f4a25;--gt:#b8ecbd;--r:#552121;--rt:#f5bcbc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.del{background:#b3261e}
main{padding:14px 16px 40px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
input{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chq{background:var(--g)!important;color:var(--gt)!important;font-weight:600}
.csh{background:var(--r)!important;color:var(--rt)!important;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item b{font-size:17px}.acts{display:flex;gap:6px}.acts button{padding:7px 10px;font-size:14px}
.tot{display:grid;gap:8px;margin-left:auto;width:100%}
.tot div{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.tot .chq,.tot .csh{border:0}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;font-size:15px}
td.n,th.n{text-align:right}
.cust{text-align:center;font-size:21px;font-weight:700;padding:8px;border:1px solid var(--line);background:var(--card);border-bottom:0}
.wrap{overflow-x:auto}
.empty{text-align:center;color:var(--mute);padding:40px 0}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000}}
</style></head><body>
<header><h1 id="ttl">Tiles Accounts</h1><button id="newBtn">Start New Calculation</button></header>
<main id="app"></main>
<script>
var pend=-1;var KEY="tiles_bills_v1",bills=[],cur=null,view="list";
try{bills=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){bills=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(bills))}catch(e){}}
function blank(){return{size:"",surface:"",qty:"",rate:"",sqft:"",bill:""}}
function num(v){return parseFloat(v)||0}
// Formulas (change here if needed)
function amt(r){return num(r.qty)*num(r.rate)*num(r.sqft)}
function chq(r){return num(r.qty)*num(r.bill)*1.18}
function csh(r){return amt(r)-chq(r)}
function f(n){return n.toLocaleString("en-IN",{maximumFractionDigits:2})}
function sum(b,fn){return b.rows.reduce(function(s,r){return s+fn(r)},0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var app=document.getElementById("app"),ttl=document.getElementById("ttl");
document.getElementById("newBtn").onclick=function(){cur={id:Date.now(),name:"",rows:[blank()]};view="form";render()};
function render(){
 
 if(view==="list")list();else if(view==="form")form();else out();
}
function list(){
 ttl.textContent="Saved Customers";
 if(!bills.length){app.innerHTML='<div class="empty">No saved bills yet.<br>Tap “+ Add New Customer” to start.</div>';return}
 app.innerHTML=bills.map(function(b,i){return '<div class="card item"><div><b>'+esc(b.name||"No name")+'</b><div style="color:var(--mute);font-size:13px">Total ₹'+f(sum(b,amt))+'</div></div><div class="acts"><button class="ghost" data-a="see" data-i="'+i+'">See output</button><button class="ghost" data-a="edit" data-i="'+i+'">Edit</button><button class="del" data-a="del" data-i="'+i+'">'+(pend===i?"Tap again to delete":"Delete")+'</button></div></div>'}).join("");
 app.querySelectorAll("button").forEach(function(el){el.onclick=function(){
  var i=+el.dataset.i,a=el.dataset.a;
  if(a==="del"){if(pend===i){bills.splice(i,1);pend=-1;persist();list()}else{pend=i;list()}}
  else{pend=-1;cur=JSON.parse(JSON.stringify(bills[i]));view=a==="edit"?"form":"out";render()}}});
}
function form(){
 ttl.textContent="New Calculation";
 var h='<div class="card"><label>Customer name</label><input id="cn" value="'+esc(cur.name)+'" placeholder="Customer name"></div><div id="rows"></div><div id="tots"></div>';
 app.innerHTML=h;
 document.getElementById("cn").oninput=function(e){cur.name=e.target.value};
 rows();
}
function rows(){
 var F=[["size","Size","text"],["surface","Surface","text"],["qty","Quantity","number"],["rate","Rate","number"],["sqft","Sqft","number"],["bill","Bill Rate","number"]];
 document.getElementById("rows").innerHTML=cur.rows.map(function(r,i){
  return '<div class="card"><div class="grid">'+F.map(function(x){return '<div><label>'+x[1]+'</label><input data-i="'+i+'" data-k="'+x[0]+'" type="'+x[2]+'" inputmode="'+(x[2]==="number"?"decimal":"text")+'" value="'+esc(r[x[0]])+'"></div>'}).join("")+
  '<div><label>Cheque Amount</label><input class="chq" readonly id="c'+i+'"></div><div><label>Cash Amount</label><input class="csh" readonly id="s'+i+'"></div><div></div><div><label>Amount</label><input readonly id="a'+i+'"></div></div>'+(cur.rows.length>1?'<button class="del" style="margin-top:8px;padding:6px 10px;font-size:13px" data-rm="'+i+'">Remove row</button>':'')+'</div>'}).join("");
 var q=document.getElementById("rows");
 q.querySelectorAll("input[data-k]").forEach(function(el){el.oninput=function(){
  var i=+el.dataset.i;cur.rows[i][el.dataset.k]=el.value;
  if(el.dataset.k==="size"&&el.value&&i===cur.rows.length-1){cur.rows.push(blank());var pos=el.dataset.k;rows();var n=q.querySelector('input[data-i="'+i+'"][data-k="size"]');n.focus();n.setSelectionRange(99,99);return}
  calc()}});
 q.querySelectorAll("[data-rm]").forEach(function(el){el.onclick=function(){cur.rows.splice(+el.dataset.rm,1);rows()}});
 calc();
}
function calc(){
 cur.rows.forEach(function(r,i){document.getElementById("c"+i).value=f(chq(r));document.getElementById("s"+i).value=f(csh(r));document.getElementById("a"+i).value=f(amt(r))});
 document.getElementById("tots").innerHTML='<div class="grid noprint" style="align-items:start"><div class="tot"><div><span>Total Quantity</span><span>'+f(sum(cur,function(r){return num(r.qty)}))+'</span></div><div><span><b>Total Amount</b></span><b>₹'+f(sum(cur,amt))+'</b></div></div><div class="tot"><div class="chq"><span>Total Cheque Amount</span><span>₹'+f(sum(cur,chq))+'</span></div><div class="csh"><span>Total Cash Amount</span><span>₹'+f(sum(cur,csh))+'</span></div><button id="sv" style="margin-top:14px">Save</button></div></div>';
 document.getElementById("sv").onclick=save;
}
function save(){
 if(!cur.name.trim()){var c=document.getElementById("cn");c.style.borderColor="#b3261e";c.placeholder="Enter customer name first";c.focus();return}
 cur.rows=cur.rows.filter(function(r){return r.size||r.qty||r.rate||r.sqft});
 if(!cur.rows.length)cur.rows=[blank()];
 var i=bills.findIndex(function(b){return b.id===cur.id});
 if(i>=0)bills[i]=cur;else bills.unshift(cur);
 persist();view="out";render();
}

function draw(){return new Promise(function(res){
 var X=[0,180,380,505,680],CW=[180,200,125,175,200],GR="#bfbfbf";
 var rs=cur.rows.filter(function(r){return r.size||r.qty||r.rate||r.sqft}),n=Math.max(5,rs.length);
 var rh=[56,40,34];for(var i=0;i<n;i++)rh.push(32);rh.push(40,52,52);
 var H=rh.reduce(function(a,b){return a+b},0),S=2,cv=document.createElement("canvas");cv.width=880*S;cv.height=H*S;
 var g=cv.getContext("2d");g.scale(S,S);g.fillStyle="#fff";g.fillRect(0,0,880,H);g.textBaseline="middle";
 function box(x0,y,w,h,t,o){o=o||{};g.fillStyle=o.bg||"#fff";g.fillRect(x0,y,w,h);g.strokeStyle="#000";g.lineWidth=1.2;g.strokeRect(x0,y,w,h);
  if(t!==""&&t!=null){g.fillStyle=o.c||"#000";g.font=(o.b?"bold ":"")+(o.s||20)+"px Arial";g.textAlign=o.a||"center";g.fillText(String(t),o.a==="left"?x0+10:x0+w/2,y+h/2)}}
 function go(img){
  box(0,0,180,96,"");
  if(img){var k=Math.min(160/img.width,76/img.height);g.drawImage(img,90-img.width*k/2,48-img.height*k/2,img.width*k,img.height*k)}
  box(180,0,700,56,cur.name,{b:1,s:24});
  box(180,56,325,40,"");
  box(505,56,375,40,"Date :- "+new Date(cur.id).toLocaleDateString("en-GB"),{a:"left"});
  var y=96;["SIZE","SURFACE","QUANTITY","RATE","AMOUNT"].forEach(function(t,j){box(X[j],y,CW[j],34,t,{bg:GR,b:1})});y+=34;
  for(var i=0;i<n;i++){var r=rs[i],v=r?[r.size,r.surface,f(num(r.qty)),f(num(r.rate)),f(amt(r))]:["","","","",""];
   v.forEach(function(t,j){box(X[j],y,CW[j],32,t)});y+=32}
  box(0,y,180,40,"",{bg:GR});box(180,y,200,40,"TOTAL QUANTITY",{bg:GR,b:1});box(380,y,125,40,f(sum(cur,function(r){return num(r.qty)})),{bg:GR,b:1});
  box(505,y,175,40,"TOTAL AMOUNT",{bg:GR,b:1});box(680,y,200,40,f(sum(cur,amt)),{bg:GR,b:1});y+=40;
  box(0,y,505,52,"");box(505,y,175,52,"CHEQUE AMOUNT",{bg:"#cfeccf",c:"#14551c",b:1});box(680,y,200,52,f(sum(cur,chq)),{bg:"#cfeccf",c:"#14551c",b:1});y+=52;
  box(0,y,505,52,"");box(505,y,175,52,"CASH AMOUNT",{bg:"#f6cccc",c:"#8a1c1c",b:1});box(680,y,200,52,f(sum(cur,csh)),{bg:"#f6cccc",c:"#8a1c1c",b:1});
  res(cv)}
 if(LOGO){var im=new Image();im.onload=function(){go(im)};im.onerror=function(){go(null)};im.src=LOGO}else go(null);
})}

 ttl.textContent="Output";
 app.innerHTML='<div class="wrap"><div id="cvh"></div></div><div class="acts noprint" style="margin-top:14px;flex-wrap:wrap"><button id="dl">Download JPG</button><button id="sh" style="background:#1e8e3e">Share</button><button class="ghost" id="bk">Back to list</button></div><p id="msg" class="noprint" style="color:var(--mute)"></p>';

 document.getElementById("dl").onclick=async function(){
  var blob=await bp,u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();
  msg.style.color="var(--gt)";msg.textContent="✓ Downloaded! Saved as JPG.";};

   if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:cur.name||"Bill"});msg.style.color="var(--gt)";msg.textContent="✓ Shared";}
   else{msg.style.color="#b3261e";msg.textContent="Share not supported in this browser. Use Download JPG."}
  }catch(e){if(!e||e.name!=="AbortError"){msg.style.color="#b3261e";msg.textContent="Could not share. Use Download JPG."}}};
}
render();
</script></body></html>
